# FlowState: static files and three functions (PLAN.md section 2). Site: flowstate-journal.
# bridge.mts (PLAN-WORLDS.md section 5, docs/BRIDGE.md) answers /.netlify/functions/bridge. It needs
# BRIDGE_MONGODB_URI and BRIDGE_TOKEN set on the site for functions; without BRIDGE_TOKEN it answers 401 to
# everything and touches nothing.
# push.mts and checkin.mts are the Sunday question (PLAN-PUSH.md section 5, docs/PUSH.md): push.mts answers
# /api/push/* through its own config.path; checkin.mts runs hourly through its own config.schedule. Neither
# needs a redirect here. Env before the first deploy with them: VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY,
# VAPID_SUBJECT (npm run vapid prints a pair).
# Deploy: netlify deploy --build --prod (same recipe as japan-trip).

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # every function (bridge, push, checkin) is bundled by esbuild; the MongoDB driver alone is loaded as a module at
  # run time, not bundled (web-push and @netlify/blobs bundle as they did on main)
  external_node_modules = ["mongodb"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# The service worker must never be cached by the CDN or the browser, or updates stall.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The functions' answers are never cached (each function also says no-store on each one). /api/push/* is the push
# function's own path, so it is named too.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/push/*"
  [headers.values]
    Cache-Control = "no-store"

# SPA fallback, always last. Routes are hash routes, so this only catches stray paths. Netlify serves
# /.netlify/functions/* before redirects, so the bridge is never swallowed (checked under netlify dev in W0), and
# functions with a config.path are matched before redirects, so /api/push/* never lands here.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
